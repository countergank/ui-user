server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite SPA base path is "/"
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve hashed static assets with a long cache lifetime
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
