name: PR Guard

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: read
  contents: read

jobs:
  guard:
    name: PR Requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check PR rules
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            const author = context.payload.pull_request.user.login;

            console.log(`🔍 Checking PR #${prNumber} by @${author}`);

            // 1. Check if author is admin
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: repo.owner,
              repo: repo.repo,
              username: author
            });

            const isAdmin = permission.permission === 'admin';
            console.log(`👤 @${author} permission: ${permission.permission} (admin: ${isAdmin})`);

            // 2. Check reviews
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: prNumber
            });

            const approvals = reviews.filter(r => r.state === 'APPROVED' && r.user.login !== author);
            const hasApproval = approvals.length > 0;
            console.log(`✅ Approvals from others: ${approvals.length}`);

            // 3. Check unresolved conversations
            const { data: threads } = await github.rest.pulls.listReviewComments({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: prNumber
            });

            // Get review threads — conversations are resolved at PR level, need different endpoint
            // Using the GraphQL API would be better, but let's use a simpler heuristic
            const { data: prData } = await github.rest.pulls.get({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: prNumber
            });

            // Check if PR has unresolved threads via the timeline
            let unresolvedCount = 0;
            try {
              const { data: timeline } = await github.rest.issues.listEvents({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: prNumber
              });
              
              // Count unresolved conversations  
              const unresolvedEvents = timeline.filter(e => e.event === 'conversation_unresolved');
              const resolvedEvents = timeline.filter(e => e.event === 'conversation_resolved');
              unresolvedCount = unresolvedEvents.length - resolvedEvents.length;
              if (unresolvedCount < 0) unresolvedCount = 0;
            } catch (e) {
              console.log(`⚠️ Could not check conversations: ${e.message}`);
              unresolvedCount = 0; // Don't fail on API issues
            }

            console.log(`💬 Unresolved conversations: ${unresolvedCount}`);

            // 4. Decision
            let conclusion = 'success';
            let summary = '';

            if (unresolvedCount > 0) {
              conclusion = 'failure';
              summary += `❌ ${unresolvedCount} conversation(s) unresolved. `;
            }

            if (!hasApproval && !isAdmin) {
              conclusion = 'failure';
              summary += '❌ No approvals from other reviewers. ';
            } else if (!hasApproval && isAdmin) {
              summary += '⚠️ Admin bypass — no approvals required. ';
            } else {
              summary += `✅ ${approvals.length} approval(s). `;
            }

            if (unresolvedCount === 0) {
              summary += '✅ All conversations resolved. ';
            }

            console.log(`🏁 Conclusion: ${conclusion}`);
            console.log(`📋 Summary: ${summary}`);

            // Set the workflow conclusion
            if (conclusion === 'failure') {
              core.setFailed(summary);
            } else {
              console.log(summary);
            }
